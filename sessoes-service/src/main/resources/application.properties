# ===== Serviço de Sessões =====
spring.application.name=sessoes-service
server.port=${PORT:8082}

# ===== Banco de dados próprio: db_sessoes =====
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/db_sessoes;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

server.error.include-message=always
server.error.include-binding-errors=always

# ===== Comunicação com outro microsserviço =====
# Endereço do Serviço de Filmes (este serviço CONSOME o de Filmes)
# Na nuvem, defina a variável FILMES_SERVICE_URL com o link do Render do serviço de filmes
filmes.service.url=${FILMES_SERVICE_URL:http://localhost:8081}
