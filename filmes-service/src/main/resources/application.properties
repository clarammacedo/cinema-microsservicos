# ===== Serviço de Filmes =====
spring.application.name=filmes-service
# Na nuvem (Render) a porta vem da variável PORT; localmente usa 8081
server.port=${PORT:8081}

# ===== Banco de dados próprio: db_filmes =====
# Localmente é um arquivo H2 em ./data/db_filmes.mv.db
# Na nuvem dá para trocar por PostgreSQL definindo DB_URL, DB_USER e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/db_filmes;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do banco (http://localhost:8081/h2-console) - bom para mostrar no vídeo
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Devolve a mensagem de erro no JSON (o frontend mostra para o usuário)
server.error.include-message=always
server.error.include-binding-errors=always
